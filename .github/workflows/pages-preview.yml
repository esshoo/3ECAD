name: 3ECAD GitHub Pages Preview

on:
  push:
    branches:
      - preview/github-pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build projects
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          pnpm build

      - name: Build docs
        run: pnpm docs:build

      - name: Prepare examples site
        run: pnpm pre-serve

      - name: Install Playwright system dependencies
        run: pnpm --filter @mlightcad/cad-viewer-example exec playwright install-deps chromium

      - name: Export self-contained HTML demo
        run: node packages/examples/exportDemoHtml.js
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload complete examples site
        uses: actions/upload-pages-artifact@v4
        with:
          path: packages/examples/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4